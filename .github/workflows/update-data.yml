name: 지도 데이터 갱신

# 노션 지원사업 DB를 읽어 data.json을 다시 만든다. 노션에는 쓰지 않는다.
# 공고 수집 회차(11:50·18:50) 20분 뒤에 돈다. Actions 탭에서 손으로도 돌릴 수 있다.
on:
  schedule:
    - cron: "10 3,10 * * *"   # UTC 03:10·10:10 = 한국 12:10·19:10
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 노션에서 마감 전 공고 읽기
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python3 tools/notion_export.py "$RUNNER_TEMP/rows.json"

      - name: data.json 다시 만들기
        run: python3 tools/update_data.py "$RUNNER_TEMP/rows.json" --full

      - name: 바뀌었으면 올리기
        id: push
        run: |
          if git diff --quiet -- data.json; then
            echo "바뀐 것 없음"; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "Pensieve 지도 갱신"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: 페이지 다시 배포 요청
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "배포 요청 실패(푸시로 자동 배포됨)"

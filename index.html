<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>창업 지원사업 지도</title>
<meta name="description" content="전국 창업·지원사업 공고를 시도별 지도와 필터로 찾아보는 페이지">
<link rel="icon" href="brand/pensieve-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* Pensieve 사이트(pensieve.kr) 스타일: 남색 먹 + 청록, 옅은 하늘빛 면, 알약 단추, 둥근 20px 면 */
:root{
  --bg:#ffffff; --mist:#f2f6f8; --surface:#ffffff; --ink:#0b1b34; --ink-2:#13284a; --muted:#56637a; --faint:#8592a6;
  --line:#dce5ea; --line-strong:#c4d1d9; --land0:#e8eef2; --sea:#ffffff; --edge:#ffffff;
  --teal:#11a9b8; --accent:#00788a; --deep:#00506e; --accent-ink:#ffffff; --urgent:#d0443c; --soon:#a86b00;
  --k-F:#e07b39; --k-L:#8a6d4b; --k-S:#2e9e6e; --k-H:#5b6fd8; --k-C:#11a9b8; --k-M:#d0466a; --k-E:#9b59b6; --k-P:#d4a017; --k-X:#8592a6;
  --c1:#dff3f5; --c2:#9fdfe5; --c3:#3fbcc8; --c4:#0b8a9d; --c5:#0d4466;
  --font:"Pensieve Sans","Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --r-md:12px; --r-lg:20px; --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1b34; --mist:#13284a; --surface:#0f2140; --ink:#eef3f9; --ink-2:#d6e0ec; --muted:#b4c2d4; --faint:#8592a6;
  --line:#24406a; --line-strong:#2f5080; --land0:#1b3358; --sea:#0f2140; --edge:#0f2140;
  --teal:#2fd0db; --accent:#2fd0db; --deep:#7fe3ea; --accent-ink:#0b1b34; --urgent:#ff7b72; --soon:#f0b44a;
  --k-F:#f39a5f; --k-L:#c09a6e; --k-S:#52c48f; --k-H:#8c9cf0; --k-C:#2fd0db; --k-M:#ef7896; --k-E:#c58ae0; --k-P:#e8c23d; --k-X:#a4b0c2;
  --c1:#173a5e; --c2:#0f5f7a; --c3:#11a9b8; --c4:#2fd0db; --c5:#b6f3f6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1b34; --mist:#13284a; --surface:#0f2140; --ink:#eef3f9; --ink-2:#d6e0ec; --muted:#b4c2d4; --faint:#8592a6;
  --line:#24406a; --line-strong:#2f5080; --land0:#1b3358; --sea:#0f2140; --edge:#0f2140;
  --teal:#2fd0db; --accent:#2fd0db; --deep:#7fe3ea; --accent-ink:#0b1b34; --urgent:#ff7b72; --soon:#f0b44a;
  --k-F:#f39a5f; --k-L:#c09a6e; --k-S:#52c48f; --k-H:#8c9cf0; --k-C:#2fd0db; --k-M:#ef7896; --k-E:#c58ae0; --k-P:#e8c23d; --k-X:#a4b0c2;
  --c1:#173a5e; --c2:#0f5f7a; --c3:#11a9b8; --c4:#2fd0db; --c5:#b6f3f6;
  color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
a{color:inherit}
.gut{max-width:1240px;margin:0 auto;padding-left:max(clamp(20px,4vw,40px),env(safe-area-inset-left,0px));padding-right:max(clamp(20px,4vw,40px),env(safe-area-inset-right,0px))}

/* 머리 줄 */
.site{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.site .gut{height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:700;letter-spacing:.14em;font-size:15px}
.brand img{width:26px;height:auto}
.brand small{font-weight:500;letter-spacing:-.01em;color:var(--muted);font-size:14px;padding-left:10px;border-left:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;font:inherit;font-size:14px;font-weight:600;text-decoration:none;padding:8px 16px;cursor:pointer;border:1px solid transparent;transition:background .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease)}
.pill.solid{background:var(--ink);color:var(--bg)}
.pill.solid:hover{background:var(--ink-2)}
.pill.line{background:var(--surface);color:var(--ink);border-color:var(--line-strong)}
.pill.line:hover{border-color:var(--ink)}
.hero-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:16px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;font:inherit;font-size:15.5px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:999px;padding:12px 44px 12px 46px;outline:none;transition:border-color .18s var(--ease)}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:var(--teal)}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{position:absolute;right:10px;width:28px;height:28px;border-radius:50%;border:0;background:var(--mist);color:var(--muted);font:inherit;font-size:16px;line-height:1;cursor:pointer}
.none a{color:var(--accent);font-weight:600}
mark{background:color-mix(in srgb,var(--teal) 22%,transparent);color:inherit;border-radius:3px;padding:0 1px}

/* 첫 화면 */
.hero{padding-block:clamp(36px,6vw,64px) clamp(24px,4vw,36px);display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:24px 40px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--accent);background:color-mix(in srgb,var(--teal) 10%,transparent);border-radius:999px;padding:5px 12px}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--teal)}
h1{font-size:clamp(30px,4.6vw,44px);line-height:1.15;font-weight:650;letter-spacing:-.042em;margin:16px 0 10px;text-wrap:balance}
.lede{margin:0;font-size:clamp(15.5px,1.6vw,17.5px);color:var(--muted);max-width:34em}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-size:30px;font-weight:650;letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.stat:nth-child(2) b{color:var(--urgent)}

/* 필터 */
.filters{background:var(--mist);border-radius:var(--r-lg);padding:18px 20px;display:grid;gap:12px;margin-bottom:20px}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
.flabel{font-size:13px;font-weight:600;color:var(--muted);width:68px;flex:none}
.chip{font:inherit;font-size:13.5px;font-weight:500;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:border-color .18s var(--ease),background .18s var(--ease),color .18s var(--ease)}
.chip:hover{border-color:var(--line-strong)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,select:focus-visible,.more:focus-visible,.pill:focus-visible,.reset:focus-visible,path.rg:focus-visible,g.nat:focus-visible,.card a:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
select{font:inherit;font-size:13.5px;font-weight:500;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;max-width:100%;cursor:pointer}
.reset{margin-left:auto;font:inherit;font-size:13.5px;font-weight:600;color:var(--accent);background:none;border:0;cursor:pointer;padding:6px 4px}

/* 본문 두 칸 */
.main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--mist);border-radius:var(--r-lg);padding:20px;min-width:0}
.panel h2{font-size:18px;font-weight:650;letter-spacing:-.03em;margin:0}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted)}

/* 지도 */
.mapbox{position:relative;background:var(--sea);border-radius:var(--r-md);overflow:hidden}
svg.map{display:block;width:100%;height:auto;max-width:100%}
path.rg{stroke:var(--edge);stroke-width:1.2;stroke-linejoin:round;cursor:pointer;transition:fill .24s var(--ease)}
path.rg:hover{stroke:var(--ink);stroke-width:1.6}
path.rg.on{stroke:var(--ink);stroke-width:2.6}
path.rg.zero{cursor:default}
.lbl{pointer-events:none}
.lbl rect{fill:var(--surface);opacity:.94}
.lbl text{font-family:var(--font);font-size:10.5px;font-weight:500;fill:var(--ink)}
.lbl .n{font-weight:700;font-size:11px}
.lbl .u{font-weight:700;font-size:9.5px;fill:var(--urgent)}
g.nat{cursor:pointer}
g.nat rect.box{fill:var(--mist);stroke:var(--line);stroke-width:1}
g.nat.on rect.box{stroke:var(--ink);stroke-width:2}
g.nat text{font-family:var(--font);fill:var(--ink)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;padding:8px 10px;border-radius:10px;line-height:1.45;max-width:230px;transform:translate(-50%,calc(-100% - 12px))}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:14px;font-size:13px;color:var(--muted);align-items:center}
.ramp{display:inline-flex;align-items:center;gap:0}
.ramp span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.ramp i{width:46px;height:10px;display:block}
.ramp span:first-child i{border-radius:5px 0 0 5px}.ramp span:last-child i{border-radius:0 5px 5px 0}
.mix{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.mix .bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--land0)}
.mix .bar i{display:block;height:100%}
.mix .keys{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px;color:var(--muted)}
.mix .keys b{color:var(--ink);font-weight:650}

/* 목록 */
.list{display:grid;gap:10px;max-height:860px;overflow-y:auto;padding-right:2px}
.card{background:var(--surface);border:1px solid transparent;border-radius:var(--r-md);padding:14px 16px;display:grid;grid-template-columns:56px minmax(0,1fr);gap:14px;align-items:start;transition:border-color .18s var(--ease)}
.card:hover{border-color:var(--line-strong)}
.dd{font-weight:700;font-size:12.5px;text-align:center;border-radius:999px;padding:5px 0;background:var(--mist);color:var(--muted)}
.dd.u{background:var(--urgent);color:var(--bg)}
.dd.s{color:var(--soon);background:transparent;box-shadow:inset 0 0 0 1.5px var(--soon)}
.card h3{font-size:15.5px;font-weight:650;letter-spacing:-.025em;margin:0;line-height:1.4}
.card h3 a{text-decoration:none}
.card h3 a:hover{color:var(--accent)}
.org{font-size:13px;color:var(--muted);margin-top:2px}
.sum{font-size:14px;margin-top:6px;color:var(--ink-2)}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:13px;align-items:center}
.kind{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.amt{font-weight:700}
.tg{color:var(--muted)}
.scope{font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;background:var(--mist);color:var(--muted)}
.none{padding:40px 8px;text-align:center;color:var(--muted);font-size:14px}
.more{font:inherit;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px;cursor:pointer}
.more:hover{border-color:var(--line-strong)}

/* 바닥 */
.foot{margin-top:48px;border-top:1px solid var(--line)}
.foot .gut{padding-block:24px 40px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted)}
.foot a{text-decoration:none;font-weight:600;color:var(--ink)}
@media (max-width:560px){.brand small{display:none}.stats{gap:20px}.stat b{font-size:24px}.flabel{width:100%}.panel,.filters{padding:16px}.card{grid-template-columns:48px minmax(0,1fr);gap:10px;padding:12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<header class="site">
  <div class="gut">
    <a class="brand" href="https://www.pensieve.kr" aria-label="펜시브 홈"><img src="brand/pensieve-mark.svg" alt="" width="26" height="29">PENSIEVE<small>지원사업 지도</small></a>
    <a class="pill solid" href="https://www.pensieve.kr" rel="noopener">펜시브 알아보기</a>
  </div>
</header>
<div class="gut">
  <section class="hero">
    <div>
      <div class="eyebrow" id="eyebrow">마감 전 공고를 불러오는 중</div>
      <h1>창업 지원사업 지도</h1>
      <p class="lede">전국에서 열린 창업·지원사업 공고를 지역, 지원 형태, 금액, 마감으로 골라 보세요.</p>
      <div class="hero-acts"><a class="pill line" id="suggest" href="https://grass-law-684.notion.site/f7fc9bf644d142aaa8777b059624619f" target="_blank" rel="noopener">없는 공고 알려주기 · 링크나 포스터 사진</a></div>
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="filters" aria-label="필터">
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="q" placeholder="사업명·기관·내용으로 검색 (예: 울산, 예비창업패키지, 창업진흥원)" aria-label="공고 검색" autocomplete="off">
      <button class="clear" id="q-clear" type="button" aria-label="검색어 지우기" hidden>×</button>
    </div>
    <div class="frow"><span class="flabel">지원 형태</span><span class="frow" id="f-kind"></span><button class="reset" id="reset" type="button">필터 초기화</button></div>
    <div class="frow"><span class="flabel">신청 대상</span><span class="frow" id="f-tgt"></span></div>
    <div class="frow">
      <span class="flabel">금액·마감</span>
      <select id="f-amt" aria-label="금액 구간">
        <option value="all">금액 전체</option>
        <option value="a1">100만원 이하</option>
        <option value="a2">100만~1천만원</option>
        <option value="a3">1천만~5천만원</option>
        <option value="a4">5천만원 넘음</option>
        <option value="a0">금액 미기재</option>
      </select>
      <select id="f-dl" aria-label="마감">
        <option value="all">마감 전체</option>
        <option value="d7">7일 이내</option>
        <option value="d30">30일 이내</option>
        <option value="dn">상시·미정</option>
      </select>
      <select id="f-scope" aria-label="신청 범위">
        <option value="all">신청 범위 전체</option>
        <option value="N">전국에서 신청 가능</option>
        <option value="L">지역 한정</option>
      </select>
    </div>
  </section>

  <div class="main">
    <section class="panel" aria-label="시도별 지도">
      <div class="panel-head">
        <h2>공고 낸 곳 기준 시도별</h2>
        <select id="paint" aria-label="지도 색칠 기준">
          <option value="n">색: 공고 수</option>
          <option value="u">색: 7일 안 마감 수</option>
          <option value="a">색: 가장 큰 금액</option>
        </select>
      </div>
      <div class="mapbox" id="mapbox">
        <svg class="map" id="map" viewBox="-6 -6 620 652" role="img" aria-label="대한민국 시도별 공고 지도"></svg>
        <div class="tip" id="tip" hidden></div>
      </div>
      <div class="legend">
        <span id="legend-txt">공고 수</span>
        <span class="ramp" id="ramp"></span>
        <span>· <b style="color:var(--urgent)">빨간 숫자</b>는 7일 안 마감</span>
        <span>· 시도를 누르면 그 지역만</span>
      </div>
      <div class="mix" id="mix"></div>
    </section>

    <section class="panel" aria-label="공고 목록">
      <div class="panel-head">
        <h2 id="list-title">전체</h2>
        <select id="sort" aria-label="정렬">
          <option value="dl">마감 임박순</option>
          <option value="amt">금액 큰 순</option>
        </select>
      </div>
      <div class="list" id="list"><div class="none">공고를 불러오는 중입니다.</div></div>
    </section>
  </div>

</div>
<footer class="foot">
  <div class="gut">
    <span>공고 내용은 바뀔 수 있으니 신청 전에 원문을 확인하세요.</span>
    <span>만든 곳 <a href="https://www.pensieve.kr">PENSIEVE</a></span>
  </div>

function chips(box,map,set,colorFn,skip=[]){
  Object.entries(map).forEach(([k,v])=>{
    if(skip.includes(k))return;
    const b=document.createElement("button");b.type="button";b.className="chip";b.id=box.id+"-"+k;b.setAttribute("aria-pressed","false");
    b.innerHTML=(colorFn?`<span class="dot" style="background:${colorFn(k)}"></span>`:"")+v;
    b.onclick=()=>{set.has(k)?set.delete(k):set.add(k);b.setAttribute("aria-pressed",set.has(k));st.shown=80;render();track("filter_change",{filter:box.id==="f-kind"?"지원형태":"신청대상",value:v,on:set.has(k)})};
    box.appendChild(b);
  });
}

let BY={};
function pick(nm){if(!BY[nm]&&st.region!==nm)return;st.region=st.region===nm?null:nm;st.shown=80;render();track("region_select",{region:nm,on:st.region===nm,count:(BY[nm]||[]).length})}
function tip(e,nm){
  const list=BY[nm]||[];const box=$("mapbox").getBoundingClientRect();const t=$("tip");
  const urg=list.filter(r=>{const d=dleft(r.d);return d!=null&&d>=0&&d<=7}).length;
  const cnt={};list.forEach(r=>cnt[r.k]=(cnt[r.k]||0)+1);
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`${KIND[k]} ${v}`).join(" · ");
  const amts=list.map(r=>r.a).filter(a=>a!=null);
  t.innerHTML=`<b>${nm==="전국"?"전국·중앙":nm}</b> ${list.length}건${urg?` · 7일 안 마감 ${urg}`:""}${top?`<br>${top}`:""}${amts.length?`<br>최대 ${won(Math.max(...amts))}`:""}`;
  t.style.left=(e.clientX-box.left)+"px";t.style.top=(e.clientY-box.top)+"px";t.hidden=false;
}

const norm=s=>String(s||"").toLowerCase().replace(/\s+/g,"");
function pass(r){
  if(st.q){if(!r._s)r._s=norm(r.n+" "+r.o+" "+(r.m||""));for(const w of st.q.split(/\s+/).filter(Boolean))if(!r._s.includes(norm(w)))return false}
  const dl=dleft(r.d);
  if(dl!=null&&dl<0)return false;
  if(st.kinds.size&&!st.kinds.has(r.k))return false;
  if(st.tgts.size&&!r.t.some(t=>st.tgts.has(t)))return false;
  if(st.amt!=="all"&&band(r.a)!==st.amt)return false;
  if(st.dl==="d7"&&!(dl!=null&&dl<=7))return false;
  if(st.dl==="d30"&&!(dl!=null&&dl<=30))return false;
  if(st.dl==="dn"&&r.d)return false;
  if(st.scope!=="all"&&r.sc!==st.scope)return false;
  return true;
}

function renderMap(){
  const val=nm=>{const l=BY[nm]||[];if(st.paint==="u")return l.filter(r=>{const d=dleft(r.d);return d!=null&&d<=7}).length;if(st.paint==="a"){const a=l.map(r=>r.a).filter(x=>x!=null);return a.length?Math.max(...a):0}return l.length};
  const regs=Object.keys(GEO);
  // 5단계 분위수 구간: 값이 있는 시도들을 고르게 다섯 색으로 나눔
  const vals=regs.map(val).filter(v=>v>0).sort((a,b)=>a-b);
  const brk=[1,2,3,4].map(i=>vals.length?vals[Math.min(vals.length-1,Math.floor(vals.length*i/5))]:Infinity);
  const cls=v=>!v?0:1+brk.filter(b=>v>=b).length;
  const fmt=v=>st.paint==="a"?won(v).replace("원",""):v;
  const lo=[vals[0]??0,...brk];
  $("ramp").innerHTML=[1,2,3,4,5].map(i=>`<span><i style="background:var(--c${i})"></i>${vals.length?fmt(lo[i-1])+(i===5?"+":""):""}</span>`).join("");
  regs.forEach(nm=>{
    const v=val(nm),n=(BY[nm]||[]).length,p=paths[nm];
    const c=cls(v);
    p.style.fill=c?`var(--c${c})`:"var(--land0)";
    p.classList.toggle("on",st.region===nm);p.classList.toggle("zero",!n);
    p.setAttribute("aria-pressed",st.region===nm);p.setAttribute("aria-label",`${nm} ${n}건`);
    const L=labels[nm],urg=(BY[nm]||[]).filter(r=>{const d=dleft(r.d);return d!=null&&d<=7}).length;
    L.t.innerHTML=`${nm} <tspan class="n">${n}</tspan>${urg?` <tspan class="u">${urg}</tspan>`:""}`;
    const w=L.t.getComputedTextLength?L.t.getComputedTextLength():40;L.r.setAttribute("x",L.x-w/2-4);L.r.setAttribute("width",w+8);
  });
  const nl=BY["전국"]||[];$("nat-n").textContent=nl.length;
  const nu=nl.filter(r=>{const d=dleft(r.d);return d!=null&&d<=7}).length;$("nat-u").textContent=nu?`${nu} 임박`:"";
  nat.classList.toggle("on",st.region==="전국");nat.setAttribute("aria-pressed",st.region==="전국");
  $("legend-txt").textContent={n:"공고 수",u:"7일 안 마감 수",a:"가장 큰 금액"}[st.paint];
}

$("list").addEventListener("click",e=>{const a=e.target.closest("a[data-i]");if(!a)return;const r=LAST[+a.dataset.i];if(!r)return;
  track("notice_click",{name:r.n,org:r.o,sido:r.g,kind:KIND[r.k],amount:r.a,deadline_days:dleft(r.d),scope:SCOPE[r.sc],targets:r.t.map(t=>TGT[t]),rank:+a.dataset.i+1,url:a.href})});
function hl(s){s=esc(s);const ws=st.q.split(/\s+/).filter(w=>w.length>=1).map(w=>esc(w).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));if(!ws.length)return s;try{return s.replace(new RegExp("("+ws.join("|")+")","gi"),"<mark>$1</mark>")}catch(e){return s}}
function renderList(rows){
  const sorted=[...rows].sort((x,y)=>{
    if(st.sort==="amt")return(y.a??-1)-(x.a??-1);
    const a=dleft(x.d),b=dleft(y.d);return(a==null?1e5:a)-(b==null?1e5:b);
  });
  const name=st.region?(st.region==="전국"?"전국·중앙":st.region):"전체 지역";
  $("list-title").textContent=`${name} · ${rows.length}건`;
  const box=$("list");
  if(!sorted.length){box.innerHTML=`<div class="none">조건에 맞는 공고가 없습니다. ${st.q?"검색어를 줄이거나 ":""}필터를 하나씩 풀어 보세요.<br><br>찾는 공고가 지도에 없다면 <a href="https://grass-law-684.notion.site/f7fc9bf644d142aaa8777b059624619f" target="_blank" rel="noopener" id="suggest-empty">알려주세요</a>. 확인해서 올릴게요.</div>`;return}
  const part=sorted.slice(0,st.shown);
  box.innerHTML=part.map((r,i)=>{
    const d=dleft(r.d);let dd,cls="";
    if(d==null)dd="상시";else if(d===0){dd="오늘";cls="u"}else{dd="D-"+d;cls=d<=7?"u":(d<=14?"s":"")}
    const tg=r.t.map(t=>TGT[t]).join(" · ");const u=url(r.u);
    return `<article class="card"><div class="dd ${cls}">${dd}</div><div style="min-width:0">
      <h3>${u?`<a href="${esc(u)}" target="_blank" rel="noopener" data-i="${i}">${hl(r.n)}</a>`:hl(r.n)}</h3>
      <div class="org">${hl(r.o)}${st.region?"":" · "+(r.g==="전국"?"전국·중앙":r.g)}</div>
      ${r.m?`<div class="sum">${esc(r.m)}</div>`:""}
      <div class="meta"><span class="kind"><span class="dot" style="background:var(--k-${r.k})"></span>${KIND[r.k]}</span>
      ${r.a!=null?`<span class="amt">최대 ${won(r.a)}</span>`:`<span class="tg">금액 미기재</span>`}
      <span class="scope">${SCOPE[r.sc]}</span>
      ${tg?`<span class="tg">${tg}</span>`:""}</div></div></article>`;
  }).join("")+(sorted.length>st.shown?`<button class="more" id="more" type="button">${sorted.length-st.shown}건 더 보기</button>`:"");
  LAST=part;
  const m=$("more");if(m)m.onclick=()=>{st.shown+=120;renderList(rows);track("list_more",{shown:st.shown,total:rows.length})};
}

function renderStats(rows){
  const urg=rows.filter(r=>{const d=dleft(r.d);return d!=null&&d<=7}).length;
  $("stats").innerHTML=[[rows.length,"보이는 공고"],[urg,"7일 안 마감"],[rows.filter(r=>r.a!=null).length,"금액 기재"]].map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
}

function render(){
  const all=D.filter(pass);BY={};all.forEach(r=>(BY[r.g]=BY[r.g]||[]).push(r));
  if(st.region&&!BY[st.region])st.region=null;
  renderMap();
  const rows=st.region?BY[st.region]:all;
  renderMix(rows);renderList(rows);renderStats(rows);
}

$("f-amt").onchange=e=>{st.amt=e.target.value;st.shown=80;render();track("filter_change",{filter:"금액",value:e.target.selectedOptions[0].text})};
$("f-dl").onchange=e=>{st.dl=e.target.value;st.shown=80;render();track("filter_change",{filter:"마감",value:e.target.selectedOptions[0].text})};
$("f-scope").onchange=e=>{st.scope=e.target.value;st.shown=80;render();track("filter_change",{filter:"신청범위",value:e.target.selectedOptions[0].text})};
$("sort").onchange=e=>{st.sort=e.target.value;render();track("sort_change",{value:e.target.selectedOptions[0].text})};
$("paint").onchange=e=>{st.paint=e.target.value;renderMap();track("map_paint_change",{value:e.target.selectedOptions[0].text})};
let qTimer=null;
$("q").addEventListener("input",e=>{st.q=e.target.value.trim();st.shown=80;$("q-clear").hidden=!st.q;render();
  clearTimeout(qTimer);if(st.q.length>=2)qTimer=setTimeout(()=>{const n=D.filter(pass).length;track("search",{query:st.q.slice(0,40),results:n})},900)});
$("q-clear").onclick=()=>{$("q").value="";st.q="";$("q-clear").hidden=true;render();$("q").focus()};
document.addEventListener("click",e=>{const a=e.target.closest("#suggest,#suggest-empty");if(a)track("suggest_click",{from:a.id==="suggest"?"hero":"empty_list",query:st.q.slice(0,40)})});
$("reset").onclick=()=>{track("filter_reset");
  Object.assign(st,{q:"",amt:"all",dl:"all",scope:"all",region:null,shown:80});st.kinds.clear();st.tgts.clear();
  ["f-amt","f-dl","f-scope"].forEach(i=>$(i).value="all");$("q").value="";$("q-clear").hidden=true;
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed","false"));render();
};

(async()=>{
  try{
    const res=await fetch("data.json",{cache:"no-cache"});
    const J=await res.json();
    D=J.rows.map(r=>({n:r[0],o:r[1],g:r[2],k:r[3],d:r[4]||null,a:r[5],t:[...(r[6]||"")].filter(c=>TGT[c]),sc:r[7],u:r[8],m:r[9]}));
    const [y,mo,da]=J.updated.split("-").map(Number);
    $("eyebrow").textContent=`마감 전 공고 ${D.length.toLocaleString("ko-KR")}건 · ${y}년 ${mo}월 ${da}일 기준`;
    render();
    try{window.posthog&&window.posthog.register&&window.posthog.register({data_updated:J.updated})}catch(e){}
  }catch(err){track("data_load_error",{message:String(err)});
    $("list").innerHTML=`<div class="none">공고 데이터를 불러오지 못했습니다. 잠시 뒤 새로고침해 주세요.</div>`;
  }
})();
</script>
</body>
</html>
